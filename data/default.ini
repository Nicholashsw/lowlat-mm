# Default backtest config. Comments start with '#'.
# All prices/sizes in the input CSV are in integer tick units.

log_level = info
tick_size = 0.01

# Latency model (nanoseconds). Symmetric by default.
strategy_to_exchange_latency_ns = 100000
exchange_to_strategy_latency_ns = 100000
ack_latency_ns                  = 50000
fill_latency_ns                 = 50000

# Risk limits (in contract/share units).
max_position       = 200
max_order_size     = 100
max_open_qty       = 500
max_drawdown_ticks = 1e12

# Market maker parameters.
half_spread_ticks = 2
min_spread_ticks  = 1
quote_size        = 10
inv_skew          = 0.05
requote_thresh    = 1

# Output (relative to working directory).
pnl_csv    = pnl.csv
trades_csv = trades.csv
